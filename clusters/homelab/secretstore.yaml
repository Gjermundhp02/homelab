# ClusterSecretStore — split from infra.yaml specifically so its CRD (from
# external-secrets' HelmRelease in infra) is guaranteed to exist before this
# Kustomization's dry-run runs. dependsOn only unblocks once infra reports
# Ready, which for a HelmRelease means fully installed — CRDs included.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secretstore
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  dependsOn:
    - name: infra
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/secretstore
  prune: true
  wait: true
