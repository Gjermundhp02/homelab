# OpenBao + External Secrets Operator. Must reconcile before cluster/apps
# (see apps.yaml's dependsOn) since authentik/external-dns's ExternalSecret
# CRs need ESO's CRDs — and a working ClusterSecretStore — to exist first.
#
# Note: the very first reconcile here can show a transient failure on
# ClusterSecretStore itself (its own CRD, from the external-secrets
# HelmRelease in this same Kustomization, may not have registered yet) —
# self-heals on retry once the HelmRelease finishes installing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/infra
  prune: true
  wait: true
