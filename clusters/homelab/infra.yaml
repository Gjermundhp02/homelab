# OpenBao + External Secrets Operator (operators only — see secretstore.yaml
# for the ClusterSecretStore, which depends on this).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/infra
  prune: true
  wait: true
