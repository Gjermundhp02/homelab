# Points Flux at cluster/apps (test-ingress, authentik, external-dns) in
# addition to the flux-system bootstrap manifests `flux bootstrap github`
# generates alongside this file. Waits on infra.yaml so ExternalSecret CRs
# here don't get applied before OpenBao/ESO (and its CRDs) actually exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infra
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/apps
  prune: true
  wait: true
