# Points Flux at cluster/apps (test-ingress, authentik, external-dns) in
# addition to the flux-system bootstrap manifests `flux bootstrap github`
# generates alongside this file. Waits on secretstore.yaml so ExternalSecret
# CRs here don't get applied before the ClusterSecretStore actually exists
# and is authenticated against OpenBao.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secretstore
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/apps
  prune: true
  wait: true
