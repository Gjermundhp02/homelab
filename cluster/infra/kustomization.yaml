# Referenced by clusters/homelab/infra.yaml's Flux Kustomization. Must
# reconcile (and its HelmReleases actually install, CRDs included) before
# cluster/apps — see clusters/homelab/apps.yaml's dependsOn.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openbao/namespace.yaml
  - openbao/helmrepository.yaml
  - openbao/helmrelease.yaml
  - external-secrets/namespace.yaml
  - external-secrets/helmrepository.yaml
  - external-secrets/helmrelease.yaml
  - external-secrets/serviceaccount.yaml
  - external-secrets/clustersecretstore.yaml
