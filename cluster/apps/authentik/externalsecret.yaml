# Replaces the old gitignored secret.yaml — pulls from OpenBao's
# secret/authentik path (bao kv put secret/authentik secret_key=... \
# postgresql_password=...) and synthesizes the same values.yaml blob the
# HelmChart's valuesSecrets already expects (see helmchart.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-values
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-values
    template:
      engineVersion: v2
      data:
        values.yaml: |
          authentik:
            secret_key: "{{ .secretKey }}"
            postgresql:
              password: "{{ .pgPassword }}"
          postgresql:
            auth:
              password: "{{ .pgPassword }}"
  data:
    - secretKey: secretKey
      remoteRef:
        key: authentik
        property: secret_key
    - secretKey: pgPassword
      remoteRef:
        key: authentik
        property: postgresql_password
