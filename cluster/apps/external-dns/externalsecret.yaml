# Replaces the old gitignored secret.yaml — pulls from OpenBao's
# secret/external-dns path (bao kv put secret/external-dns
# cloudflare_api_token=...) into the Secret helmrelease.yaml already
# references via secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-dns-cloudflare
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: external-dns
        property: cloudflare_api_token
