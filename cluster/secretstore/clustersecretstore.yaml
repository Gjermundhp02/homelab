# Requires OpenBao (cluster/openbao) to already be initialized, unsealed,
# and have its "kubernetes" auth method + "external-secrets" role configured
# to trust the openbao-auth ServiceAccount — a one-time manual bootstrap
# (bao init/unseal/auth/policy/role can't be committed to git; see repo docs
# for the exact commands).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    openBao:
      server: "http://openbao.openbao.svc:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          role: external-secrets
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
